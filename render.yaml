services:
  - type: web
    name: adcom-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GOOGLE_REDIRECT_URI
        value: https://adcommedia.in/api/auth/google/callback
      - key: PUBLIC_SITE_URL
        value: https://adcommedia.in
      - key: FRONTEND_URL
        value: https://adcommedia.in
      - key: CORS_ORIGINS
        value: https://adcommedia.in,https://www.adcommedia.in
      - key: COOKIE_SAMESITE
        value: lax
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: ADMIN_ALLOWLIST
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
